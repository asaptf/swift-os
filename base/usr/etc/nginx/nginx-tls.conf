# swift-os nginx config (W3): HTTPS with a baked self-signed cert. Run with:
#   nginx -c /usr/etc/nginx/nginx-tls.conf
# The cert/key are baked at /usr/etc/nginx/certs (build-time self-signed,
# CN=swift-os) — replace with acme.sh / Let's Encrypt certs later.
daemon off;
master_process off;
error_log /tmp/nginx-error.log info;
pid /tmp/nginx.pid;

events {
    worker_connections 16;
}

http {
    access_log off;
    client_body_temp_path /tmp/nginx-client-body;

    server {
        listen 8443 ssl;
        server_name swift-os;
        ssl_certificate /usr/etc/nginx/certs/server.crt;
        ssl_certificate_key /usr/etc/nginx/certs/server.key;
        root /usr/share/nginx/html;
        location / {
            index index.html;
        }
    }
}
