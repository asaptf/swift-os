# swift-os nginx config (W2): serve the web root and write logs on the persistent
# /data tier (datafs), so hosted content survives reboot. Run explicitly with:
#   nginx -c /usr/etc/nginx/nginx-data.conf
# The web root (/data/www) and log dir (/data/logs) must exist before start.
daemon off;
master_process off;
error_log /data/logs/error.log info;
pid /tmp/nginx.pid;

events {
    worker_connections 16;
}

http {
    access_log /data/logs/access.log;
    client_body_temp_path /tmp/nginx-client-body;

    server {
        listen 8080;
        server_name swift-os;
        root /data/www;
        location / {
            index index.html;
        }
    }
}
