# swift-os nginx — production config for swiftos.tech.
# Serves the baked static site over HTTPS (real Let's Encrypt cert) and HTTP.
# Started at boot by swos-init via the `nginx-supervised` service token
# (single foreground process: daemon off / master_process off).
#
# Note: the swift-os nginx port is built --without-http_rewrite_module, so
# `return`/`rewrite` are unavailable — hence no forced http->https redirect here;
# :80 serves the same site. `try_files` is part of the core module and works.
daemon off;
master_process off;
error_log /tmp/nginx-error.log info;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log off;
    client_body_temp_path /tmp/nginx-client-body;

    # Minimal MIME map (the port ships no mime.types); without this CSS/JS would
    # be served as octet-stream and browsers would refuse to apply them.
    types {
        text/html                 html htm;
        text/css                  css;
        application/javascript    js mjs;
        application/json          json map webmanifest;
        application/xml           xml;
        image/svg+xml             svg;
        image/png                 png;
        image/jpeg                jpg jpeg;
        image/webp                webp;
        image/x-icon              ico;
        font/woff2                woff2;
        font/woff                 woff;
        text/plain                txt;
    }
    default_type application/octet-stream;

    server {
        listen 443 ssl;
        listen 80;
        server_name swiftos.tech;

        ssl_certificate     /usr/etc/nginx/certs/server.crt;
        ssl_certificate_key /usr/etc/nginx/certs/server.key;

        root /usr/share/nginx/html;

        # Clean URLs: /status -> status.html, /docs/concepts -> docs/concepts.html
        location / {
            try_files $uri $uri.html $uri/index.html =404;
        }
    }
}
