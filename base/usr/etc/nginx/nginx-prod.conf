# swift-os nginx — production config for swiftos.tech.
# Serves the static site from the persistent /data tier (/data/www/current,
# seeded at boot from the baked default) over HTTPS (real Let's Encrypt cert)
# and HTTP, so content updates need no base-image reflash.
# Started at boot by swos-init via the `nginx-supervised` service token
# (single foreground process: daemon off / master_process off).
#
# Note: the swift-os nginx port is built --without-http_rewrite_module, so
# `return`/`rewrite` are unavailable — hence no forced http->https redirect here;
# :80 serves the same site. `try_files` is part of the core module and works.
daemon off;
master_process off;
error_log /tmp/nginx-error.log error;
pid /tmp/nginx.pid;
# Let nginx use the full per-process fd budget (kernel maxFDs = 512). Each live
# HTTPS connection needs a socket fd plus a file fd while serving, so headroom
# well above worker_connections is required or concurrent requests 500 on a
# failed open / get refused on a failed accept.
worker_rlimit_nofile 512;

events {
    worker_connections 128;
}

http {
    access_log off;
    client_body_temp_path /tmp/nginx-client-body;
    # Recycle sockets quickly: the kernel TCP table is finite (maxSockets = 256),
    # so idle keepalive clients (and bots) must not pin connection slots for long.
    keepalive_timeout 15s;
    keepalive_requests 200;

    # Minimal MIME map (the port ships no mime.types); without this CSS/JS would
    # be served as octet-stream and browsers would refuse to apply them.
    types {
        text/html                 html htm;
        text/css                  css;
        application/javascript    js mjs;
        application/json          json map webmanifest;
        application/xml           xml;
        image/svg+xml             svg;
        image/png                 png;
        image/jpeg                jpg jpeg;
        image/webp                webp;
        image/x-icon              ico;
        font/woff2                woff2;
        font/woff                 woff;
        text/plain                txt;
    }
    default_type application/octet-stream;

    server {
        listen 443 ssl;
        listen 80;
        server_name swiftos.tech;

        ssl_certificate     /usr/etc/nginx/certs/server.crt;
        ssl_certificate_key /usr/etc/nginx/certs/server.key;

        # Persistent docroot on the writable /data tier, seeded at boot from the
        # baked /usr/share/nginx/html and swapped atomically by /bin/swupdate.
        # Lets the running box take new site content without a base-image reflash.
        root /data/www/current;

        # Clean URLs: /status -> status.html, /docs/concepts -> docs/concepts.html
        location / {
            try_files $uri $uri.html $uri/index.html =404;
        }
    }
}
