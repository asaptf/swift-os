# swift-os nginx config (W1). Single-process, foreground (no daemon/worker fork),
# poll events. All writable paths live under /tmp (tmpfs) since /usr is read-only.
# W2 moves the web root + logs onto the persistent /data tier.
daemon off;
master_process off;
error_log /tmp/nginx-error.log info;
pid /tmp/nginx.pid;

events {
    # Keep at/under the per-process open-file limit (RLIMIT_NOFILE) to avoid the
    # startup warning; plenty for a single-process static server.
    worker_connections 16;
}

http {
    access_log off;
    client_body_temp_path /tmp/nginx-client-body;

    server {
        listen 8080;
        server_name swift-os;
        root /usr/share/nginx/html;
        location / {
            index index.html;
        }
    }
}
