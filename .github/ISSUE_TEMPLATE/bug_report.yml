# SPDX-License-Identifier: Apache-2.0
name: Bug report
description: Something builds, boots or behaves differently than documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: [docs/TROUBLESHOOTING.md](../../blob/main/docs/TROUBLESHOOTING.md)
        covers the common build, boot, filesystem, network and QEMU-test failures.

        **Security problems do not belong here** — please use
        [private reporting](../../security/advisories/new) instead (see `SECURITY.md`).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The exact commands, in order.
      placeholder: |
        make newlib && make busybox
        make build
        make run
      render: shell
    validations:
      required: true

  - type: textarea
    id: serial
    attributes:
      label: Serial log
      description: >
        The relevant part of the serial output — the panic or the last ~40 lines
        before things went wrong. Please paste text, not a screenshot.
      render: text
    validations:
      required: true

  - type: input
    id: host
    attributes:
      label: Host
      placeholder: "macOS 15.4 Apple Silicon (M2) / Ubuntu 24.04 x86_64"
    validations:
      required: true

  - type: input
    id: toolchain
    attributes:
      label: Swift toolchain and QEMU version
      description: "`swiftc --version` and `qemu-system-aarch64 --version`."
      placeholder: "swift 6.2 dev snapshot 2026-07-01 / QEMU 11.0.3"
    validations:
      required: true

  - type: dropdown
    id: profile
    attributes:
      label: Boot profile
      options:
        - "make run (direct -kernel)"
        - "make disk-run (UEFI from GPT disk)"
        - "make uefi-run (UEFI, virtual FAT)"
        - "bare metal (Hetzner Cloud ARM)"
        - "VirtualBox ARM"
        - "in-browser (swiftos.tech/try)"
        - other / not sure
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`.
    validations:
      required: true
